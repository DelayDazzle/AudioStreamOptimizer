name: Build SMAPI Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Mod
      run: dotnet build --configuration Release --no-restore

    - name: Upload Mod Files
      uses: actions/upload-artifact@v4
      with:
        name: AudioStreamOptimizer
        path: |
          bin/Release/net6.0/AudioStreamOptimizer.dll
          manifest.json
          i18n/
